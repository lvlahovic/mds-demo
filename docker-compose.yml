services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    # Compose's default (10s) is shorter than spring.lifecycle.timeout-per-
    # shutdown-phase (20s) - SIGKILL would land mid-drain and make the
    # graceful shutdown pointless. The Dockerfile's exec-form ENTRYPOINT
    # makes java PID 1, so it receives Compose's SIGTERM directly.
    stop_grace_period: 30s

  inventory-service:
    build: ./inventory-service
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    # See order-service: same reasoning, same lifecycle phase timeout.
    stop_grace_period: 30s

volumes:
  redis-data:
