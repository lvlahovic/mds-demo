spring.application.name=inventory-service

spring.data.redis.host=localhost
spring.data.redis.port=6379

inventory.redis.stream-key=orders-stream
inventory.redis.dlq-stream-key=orders-stream-dlq
# Return leg: reservation outcomes published back to order-service.
inventory.redis.result-stream-key=order-results-stream
inventory.redis.consumer-group=inventory-service-group
inventory.redis.consumer-name=inventory-service-1

# How long a message may sit unacknowledged in the PEL before it is claimed
# and retried by the reclaim job.
inventory.retry.pending-threshold-ms=30000
# Fixed delay between reclaim job runs.
inventory.retry.scan-interval-ms=10000
# Attempts (including the first delivery) before a message is moved to the DLQ.
inventory.retry.max-attempts=3
