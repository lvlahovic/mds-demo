spring.application.name=inventory-service

spring.data.redis.host=localhost
spring.data.redis.port=6379

inventory.redis.stream-key=orders-stream
inventory.redis.dlq-stream-key=orders-stream-dlq
# Return leg: reservation outcomes published back to order-service.
inventory.redis.result-stream-key=order-results-stream
inventory.redis.consumer-group=inventory-service-group
inventory.redis.consumer-name=inventory-service-1

# How long a message may sit unacknowledged in the PEL before it is claimed
# and retried by the reclaim job.
inventory.retry.pending-threshold-ms=30000
# Fixed delay between reclaim job runs.
inventory.retry.scan-interval-ms=10000
# Attempts (including the first delivery) before a message is moved to the DLQ.
inventory.retry.max-attempts=3

# --- Graceful shutdown ---------------------------------------------------
# Ceiling for each SmartLifecycle phase to stop. The stream listener drains
# within its own (shorter) timeout below; this is the backstop.
spring.lifecycle.timeout-per-shutdown-phase=20s

# How long to wait for the stream listener to finish the order it is holding.
inventory.shutdown.listener-drain-timeout-ms=10000

# The reclaim job claims, reprocesses and acknowledges in one pass - killing
# its thread mid-pass would leave a message claimed by a consumer that no
# longer exists, waiting out the pending threshold again. Let a running scan
# finish instead.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=15s
