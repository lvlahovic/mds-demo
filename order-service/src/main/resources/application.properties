spring.application.name=order-service

server.port=8080

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Outbound leg: order events published for inventory-service.
order.redis.stream-key=orders-stream

# Return leg: reservation outcomes consumed back from inventory-service.
order.redis.result-stream-key=order-results-stream
order.redis.result-consumer-group=order-service-group
order.redis.result-consumer-name=order-service-1
# Set to false to run the API without the feedback loop (no Redis consumer);
# orders then stop at PUBLISHED. Used by the context test.
order.redis.result-listener-enabled=true

# How long GET /orders/{orderId}/status holds a connection open before the
# client is expected to reconnect.
order.status-stream.timeout-ms=300000

# --- Graceful shutdown ---------------------------------------------------
# Stop accepting new requests, then let in-flight ones (including open SSE
# subscriptions, until OrderStatusStream closes them) finish before the
# server goes down.
server.shutdown=graceful

# Ceiling for each SmartLifecycle phase to stop. The stream listener drains
# within its own (shorter) timeout below; this is the backstop.
spring.lifecycle.timeout-per-shutdown-phase=20s

# How long to wait for the result stream listener to finish the result it is
# applying before the context closes anyway.
order.shutdown.listener-drain-timeout-ms=10000
